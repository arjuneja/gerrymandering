<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Impossible Boss</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #0d0d0d;
            color: #ff4d4d;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        #game-container {
            background: #1a1a1a;
            padding: 30px;
            border: 3px solid #ff0000;
            width: 90%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.3);
        }
        .hidden { display: none; }
        button {
            background: #ff0000;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            cursor: pointer;
            margin: 5px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
        }
        button:hover { background: #b30000; }
        button:disabled { background: #444; cursor: not-allowed; }
        .stats { font-size: 1.3rem; margin-bottom: 20px; color: #fff; }
        #log {
            height: 180px;
            overflow-y: auto;
            background: #000;
            padding: 10px;
            margin-top: 15px;
            text-align: left;
            font-size: 0.85rem;
            border: 1px solid #333;
        }
        .win-link {
            background: gold;
            color: black;
            padding: 20px;
            font-weight: bold;
            display: block;
            margin-top: 20px;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="start-screen">
        <h1>UNBEATABLE BOSS</h1>
        <p>So since you want the album then fight me for it, and u get one chance</p>
        <button id="start-btn" onclick="startGame()">CHALLENGE BOSS</button>
        <p id="locked-msg" class="hidden" style="color: #666;">[ACCESS DENIED: PREVIOUS DEFEAT DETECTED]</p>
    </div>

    <div id="battle-screen" class="hidden">
        <div class="stats">
            YOU: <span id="p-hp" style="color: #00ff00;">100</span> | BOSS: <span id="m-hp" style="color: #ff0000;">120</span>
        </div>
        <div id="controls">
            <button onclick="playTurn('slash')">Slash (10-20)</button>
            <button onclick="playTurn('fireball')">Fireball (15-25) [80% Acc]</button>
            <button onclick="playTurn('heal')">Heal (+15 HP)</button>
        </div>
        <div id="log"></div>
    </div>

    <div id="end-screen" class="hidden">
        <h1 id="end-title"></h1>
        <div id="prize" class="hidden">
            <p>So how in allah did u do that what the hell</p>
            <a href="https://docs.google.com/presentation/d/1Z45dJWrDPY7L8e3TPqxQfkhMsR0JmLNcOwx-ubleNnM/edit?usp=sharing" class="win-link">SECRET LINK</a>
        </div>
        <p id="fail-msg" class="hidden">Lolzies!!!!!</p>
    </div>
</div>

<script>
    let pHp = 100;
    let mHp = 120; // Monster starts with more HP
    const log = document.getElementById('log');

    // On Load: Check if player is already banned or won
    window.onload = function() {
        const status = localStorage.getItem('boss_status');
        if (status === 'lost') {
            document.getElementById('start-btn').disabled = true;
            document.getElementById('locked-msg').classList.remove('hidden');
        } else if (status === 'won') {
            showEnd(true);
        }
    };

    function startGame() {
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('battle-screen').classList.remove('hidden');
        addLog("A massive shadow looms over you...");
    }

    function addLog(msg, color = "#ddd") {
        log.innerHTML += `<p style="color: ${color}">> ${msg}</p>`;
        log.scrollTop = log.scrollHeight;
    }

    function playTurn(move) {
        // --- PLAYER PHASE ---
        let pDmg = 0;
        if (move === 'slash') {
            pDmg = Math.floor(Math.random() * 11) + 10;
            mHp -= pDmg;
            addLog(`You slashed for ${pDmg} damage.`, "#00ff00");
        } else if (move === 'fireball') {
            if (Math.random() < 0.20) { // 20% miss chance
                addLog("Your Fireball sputtered out! MISS!", "#ffae00");
            } else {
                pDmg = Math.floor(Math.random() * 11) + 15;
                mHp -= pDmg;
                addLog(`Fireball exploded for ${pDmg} damage!`, "#ffae00");
            }
        } else if (move === 'heal') {
            pHp += 15;
            addLog("You used a potion. +15 HP", "#00ff00");
        }

        updateUI();
        if (mHp <= 0) return endGame(true);

        // --- MONSTER PHASE ---
        setTimeout(() => {
            let mDmg = Math.floor(Math.random() * 11) + 15; // 15-25 damage
            
            // 15% Crit Chance
            if (Math.random() < 0.15) {
                mDmg *= 2;
                addLog(`CRITICAL HIT! The boss crushes you for ${mDmg} damage!`, "#ff0000");
            } else {
                addLog(`The boss strikes for ${mDmg} damage.`, "#ff4d4d");
            }

            pHp -= mDmg;
            updateUI();

            if (pHp <= 0) endGame(false);
        }, 500);
    }

    function updateUI() {
        document.getElementById('p-hp').innerText = Math.max(0, pHp);
        document.getElementById('m-hp').innerText = Math.max(0, mHp);
    }

    function endGame(win) {
        localStorage.setItem('boss_status', win ? 'won' : 'lost');
        setTimeout(() => showEnd(win), 800);
    }

    function showEnd(win) {
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('battle-screen').classList.add('hidden');
        document.getElementById('end-screen').classList.remove('hidden');

        if (win) {
            document.getElementById('end-title').innerText = "GOD SLAIN";
            document.getElementById('prize').classList.remove('hidden');
        } else {
            document.getElementById('end-title').innerText = "YOU DIED";
            document.getElementById('fail-msg').classList.remove('hidden');
        }
    }
</script>

</body>
</html>
